[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geoffrey-llm"
version = "0.1.0"
description = "A lightweight toolkit for LLM fine-tuning, inference optimization, and agent development"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Geoffrey", email = "geoffrey@example.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.25.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "ruff>=0.1.0",
]
finetune = [
    "torch>=2.0",
    "transformers>=4.30",
    "peft>=0.5",
]
inference = [
    "vllm>=0.3.0",
    "llama-cpp-python",
]
geocode = [
    "rich>=13.0.0",
    "prompt-toolkit>=3.0.0",
]
all = [
    "geoffrey-llm[dev,finetune,inference,geocode]",
]

[project.scripts]
geoffrey-llm = "geoffrey_llm.cli:main"
geocode = "geoffrey_llm.geocode.cli:main"

[project.urls]
Homepage = "https://github.com/geoffrey-llm/geoffrey-llm"
Repository = "https://github.com/geoffrey-llm/geoffrey-llm"
Issues = "https://github.com/geoffrey-llm/geoffrey-llm/issues"
